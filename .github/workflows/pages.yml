name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 프로젝트 정적 계약
        run: |
          node --check sw.js
          node --check src/build-meta.js
          node --check src/game/runtime.js
          node --check src/game/config.js
          node --check src/game/render.js
          node --check src/game.js
          node --check src/game/ui.js
          node --check src/platform/pwa.js
          node --check scripts/cdp-harness.mjs
          node --check scripts/smoke-test.mjs
          node --check scripts/perf-test.mjs
          node --check scripts/verify-project.mjs
          node scripts/verify-project.mjs
      - name: 브라우저 기능·오프라인·성능 게이트
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wave-arena-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/smoke-test.mjs http://127.0.0.1:4173/
          mkdir -p artifacts
          PERF_OUTPUT=artifacts/perf-result.json node scripts/perf-test.mjs http://127.0.0.1:4173/
      - name: 성능 추세 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave-arena-performance
          path: artifacts/perf-result.json
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 검증된 정적 게임 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
