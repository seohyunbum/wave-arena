name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 프로젝트 정적 계약
        run: |
          node --check sw.js
          node --check src/build-meta.js
          node --check src/game/runtime.js
          node --check src/game/config.js
          node --check src/game/render.js
          node --check src/game.js
          node --check src/game/ui.js
          node --check src/platform/pwa.js
          node --check scripts/cdp-harness.mjs
          node --check scripts/smoke-test.mjs
          node --check scripts/perf-test.mjs
          node --check scripts/balance-report.mjs
          node --check scripts/verify-project.mjs
          node scripts/balance-report.mjs --check
          node scripts/verify-project.mjs
      - name: 브라우저 기능·오프라인·성능 게이트
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wave-arena-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          if ! node scripts/smoke-test.mjs http://127.0.0.1:4173/ 2>&1 | tee artifacts/smoke.log; then
            detail=$(tail -c 3000 artifacts/smoke.log | tr '\n' ' ')
            echo "::error title=Wave Arena smoke gate failed::$detail"
            exit 1
          fi
          if ! PERF_OUTPUT=artifacts/perf-result.json node scripts/perf-test.mjs http://127.0.0.1:4173/ 2>&1 | tee artifacts/perf.log; then
            detail=$(tail -c 3000 artifacts/perf.log | tr '\n' ' ')
            echo "::error title=Wave Arena performance gate failed::$detail"
            exit 1
          fi
      - name: 검증 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-arena-verification-${{ github.run_attempt }}
          path: |
            artifacts/
            /tmp/wave-arena-server.log
          if-no-files-found: warn

  deploy:
    needs: verify
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned signing dependency
        run: python -m pip install --disable-pip-version-check -r scripts/hbsy/requirements.txt
      - name: Assemble and sign public runtime
        run: node scripts/build-pages.mjs
        env:
          HBSY_SECRET_KEY: ${{ secrets.HBSY_SECRET_KEY }}
      - name: Verify final signed distribution
        run: node scripts/hbsy-release.mjs verify
      - name: Register signed release in GitHub
        run: python scripts/hbsy/checkpoint.py --index provenance/index.jsonl --pubkey .github/hbsy-pubkey.b64 --project wave-arena
      - name: Keep signed provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: hbsy-provenance-${{ github.sha }}
          path: |
            provenance/index.jsonl
            _site/hbsy.manifest.json
            _site/hbsy.pubkey
          if-no-files-found: error
      - name: 검증된 정적 게임 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
