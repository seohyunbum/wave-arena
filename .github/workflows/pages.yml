# main 에 올라갈 때마다 게임을 GitHub Pages 에 배포한다.
# configure-pages 의 enablement:true 가 Pages 가 꺼져 있으면 자동으로 켜 준다.
# 휴대폰에 앱으로 설치하려면 https 주소가 필요한데, Pages 가 https 를 준다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages 설정 (꺼져 있으면 켠다)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 저장소 전체를 그대로 업로드 (빌드 과정이 없는 단일 HTML 게임)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
